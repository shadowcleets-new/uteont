; pytest.ini — worker test discovery
;
; The worker carries two naming conventions for tests:
;   * pytest-native modules:  test_*.py with test_* functions
;   * runnable script tests:   *_test.py whose checks live in functions
;     named _test_* (semantic_agent/profile_test.py) or _run
;     (serp_agent/parse_test.py), driven by a __main__ runner.
;
; Without this config the second group is silently skipped: their functions
; don't match pytest's default ``python_functions = test*`` glob, so
; ``python -m pytest`` collected 0 tests from them. We widen both the file and
; the function patterns so every test the worker owns is collected by a plain
; ``python -m pytest`` run from this directory (and therefore by CI).
[pytest]
testpaths = agents lib
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_* _test_* _run
