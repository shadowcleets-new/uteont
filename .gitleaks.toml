# Gitleaks config — UTEONT
#
# Extends the default ruleset (covers AWS, GCP, Google API keys, GitHub
# tokens, Stripe, Slack, etc.) with explicit rules for the integrations
# this project depends on.

[extend]
useDefault = true

[[rules]]
id = "telegram-bot-token"
description = "Telegram Bot Token (numeric-id : 35-char-secret pattern)"
regex = '''\b\d{8,15}:[A-Za-z0-9_-]{35,}\b'''
keywords = ["telegram", "bot"]
tags = ["telegram", "secret"]

[[rules]]
id = "google-gemini-api-key"
description = "Google AI Studio / Gemini API key (AIzaSy prefix)"
regex = '''\bAIzaSy[A-Za-z0-9_-]{33}\b'''
keywords = ["gemini", "google", "api_key", "apikey", "AIza"]
tags = ["google", "gemini", "secret"]

[[rules]]
id = "vercel-worker-secret"
description = "High-entropy base64url string near 'WORKER_SHARED_SECRET' context"
regex = '''(?i)worker.{0,30}secret.{0,5}[=:][^\n]{0,20}([A-Za-z0-9_-]{32,})'''
keywords = ["WORKER_SHARED_SECRET", "worker_secret"]
tags = ["worker", "secret"]

# Anti-false-positive allowlist
[allowlist]
description = "Common patterns that look secret-shaped but aren't"
paths = [
  # Lockfiles regenerate constantly and trigger false positives
  '''package-lock\.json$''',
  '''pnpm-lock\.yaml$''',
  '''yarn\.lock$''',
  # next-env.d.ts is regenerated by Next
  '''next-env\.d\.ts$''',
  # Drizzle migrations contain DB column UUIDs that match generic high-entropy
  '''^drizzle/.*\.sql$''',
  # Frontend font hashes
  '''^\.next/''',
  '''node_modules/''',
]

regexes = [
  # Placeholder tokens we use in docs to SHOW what a real one would look like
  '''<TELEGRAM_BOT_TOKEN_REDACTED>''',
  '''<TELEGRAM_BOT_TOKEN_SUFFIX_REDACTED>''',
  '''<GEMINI_API_KEY_REDACTED>''',
  '''<WORKER_SECRET_REDACTED>''',
  # Schema fingerprints / hash-like strings in lockfile metadata
  '''[a-f0-9]{40,64}''',  # sha1/sha256 of file contents
]
