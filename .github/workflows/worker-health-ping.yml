name: worker-health watchdog

# Free replacement for the Vercel cron that the Hobby plan won't allow at
# 10-min frequency. Pings the worker-health endpoint, which alerts via Telegram
# if the Railway worker has hung. GitHub's minimum schedule interval is 5 min;
# scheduled runs can be delayed a few minutes under load — fine for a watchdog.
#
# Requires repo secret CRON_SECRET (same value as the Vercel env var of the same
# name). Optional repo variable WORKER_HEALTH_PING_URL overrides the default URL.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# A new run shouldn't pile up behind a slow one.
concurrency:
  group: worker-health
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping worker-health
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          URL: ${{ vars.WORKER_HEALTH_PING_URL || 'https://uteont.vercel.app/api/cron/worker-health' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set — add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          code=$(curl -sS --max-time 30 -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" "$URL" || echo "000")
          echo "HTTP $code"
          cat /tmp/body || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::worker-health ping failed (HTTP $code)"
            exit 1
          fi
