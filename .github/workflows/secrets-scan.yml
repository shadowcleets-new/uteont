name: Secrets scan

# Defense-in-depth against the F-006/F-007/F-008 class of mistake.
# Runs gitleaks on every push to main and on every PR. Catches:
#   - Provider-specific patterns (AIza* for Google, telegram tokens, etc.)
#   - Generic high-entropy strings near sensitive variable names
# Fails the workflow if any secret is detected, blocking merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history to scan past commits too

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
