name: CI

# Enforce the same gates that were previously only run locally (LO-53):
# type-check, lint, and a production build on every push + PR. Live-DB tests
# are excluded here (they need a DATABASE_URL secret + the shared Neon DB);
# add DATABASE_URL as an Actions secret and a `npm test` step to include them.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          # The app reads these at request time (dynamic routes), not at build,
          # but provide harmless placeholders so any module-level reads don't crash CI.
          DATABASE_URL: postgres://user:pass@localhost:5432/db
          AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
